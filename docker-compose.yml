version: '3.8'

services:
  headlesshere:
    build: .
    container_name: headlesshere
    privileged: true
    volumes:
      - ${LOCALPATH}:/app  # Define a local mount point for the files and mount as the app folder
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - TZ=UTC
      - PYTHONPATH=/usr/local/lib/python3.9/site-packages
    network_mode: "bridge"
    restart: always
    stdin_open: true  
    tty: true   
    command: >
      bash -c "sed -i 's/\r$$//' /app/ttnhere.sh && bash /app/ttnhere.sh"
