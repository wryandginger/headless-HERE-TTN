version: '3.8'

services:
  headlesshere:
    build: .
    container_name: headlesshere
    privileged: true
    volumes:
      - ${LOCALPATH}:/app
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - TZ=UTC
      - PYTHONPATH=/usr/local/lib/python3.9/site-packages
    network_mode: "bridge"
    restart: always
    stdin_open: true  
    tty: true   
